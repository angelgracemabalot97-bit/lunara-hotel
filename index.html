<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunara Hotel - Bookings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>LUNARA HOTEL</h1>
        <span>Luxury & Comfort</span>
    </header>

    <div class="hero">
        <h2>Welcome to Lunara Hotel</h2>
        <p>Experience world-class hospitality and luxury accommodations.</p>
    </div>

    <div class="container">
        <h2 class="section-title">Available Rooms</h2>
        
        <div class="room-grid">
            <div class="room-card">
                <img src="https://images.unsplash.com/photo-1611892440504-42a792e24d32?auto=format&fit=crop&w=600&q=80" alt="Deluxe Room">
                <div class="room-info">
                    <h3>Deluxe Room</h3>
                    <div class="room-price">₱3,500 / night</div>
                    <button class="btn-book" onclick="openBookingModal(1, 'Deluxe Room', 3500)">Book Now</button>
                </div>
            </div>

            <div class="room-card">
                <img src="https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?auto=format&fit=crop&w=600&q=80" alt="Executive Suite">
                <div class="room-info">
                    <h3>Executive Suite</h3>
                    <div class="room-price">₱6,000 / night</div>
                    <button class="btn-book" onclick="openBookingModal(2, 'Executive Suite', 6000)">Book Now</button>
                </div>
            </div>

            <div class="room-card">
                <img src="https://images.unsplash.com/photo-1631049307264-da0ec9d70304?auto=format&fit=crop&w=600&q=80" alt="Presidential Suite">
                <div class="room-info">
                    <h3>Presidential Suite</h3>
                    <div class="room-price">₱12,000 / night</div>
                    <button class="btn-book" onclick="openBookingModal(3, 'Presidential Suite', 12000)">Book Now</button>
                </div>
            </div>
        </div>
    </div>

    <div id="bookingModal" class="modal">
        <div class="modal-content">
            <h3 id="modalRoomTitle">Book Room</h3>
            <form id="bookingForm" onsubmit="submitBooking(event)">
                <input type="hidden" id="roomId">
                <input type="hidden" id="roomPrice">

                <div class="form-group">
                    <label for="guestName">Full Name</label>
                    <input type="text" id="guestName" required placeholder="Juan Dela Cruz">
                </div>

                <div class="form-group">
                    <label for="guestEmail">Email Address</label>
                    <input type="email" id="guestEmail" required placeholder="juan@example.com">
                </div>

                <div class="form-group">
                    <label>Check-In (Date & Time)</label>
                    <div class="date-time-group">
                        <input type="date" id="checkInDate" required>
                        <input type="time" id="checkInTime" value="14:00" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Check-Out (Date & Time)</label>
                    <div class="date-time-group">
                        <input type="date" id="checkOutDate" required>
                        <input type="time" id="checkOutTime" value="12:00" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="paymentMethod">Payment Method</label>
                    <select id="paymentMethod">
                        <option value="PayAtHotel">Pay at Hotel</option>
                        <option value="GCash">GCash</option>
                        <option value="CreditCard">Credit Card</option>
                    </select>
                </div>

                <div id="responseMessage"></div>

                <div class="modal-actions">
                    <button type="button" class="btn-close" onclick="closeBookingModal()">Cancel</button>
                    <button type="submit" class="btn-submit">Confirm Booking</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:3000/api/v1';

        function openBookingModal(roomId, roomName, price) {
            document.getElementById('roomId').value = roomId;
            document.getElementById('roomPrice').value = price;
            document.getElementById('modalRoomTitle').innerText = `Book ${roomName} (₱${price.toLocaleString()}/night)`;
            document.getElementById('responseMessage').innerText = '';
            document.getElementById('bookingModal').style.display = 'flex';
        }

        function closeBookingModal() {
            document.getElementById('bookingModal').style.display = 'none';
            document.getElementById('bookingForm').reset();
        }

        async function submitBooking(event) {
            event.preventDefault();
            const responseMsg = document.getElementById('responseMessage');
            responseMsg.style.color = '#1b365d';
            responseMsg.innerText = 'Processing booking...';

            const payload = {
                room_id: parseInt(document.getElementById('roomId').value),
                guest_name: document.getElementById('guestName').value,
                guest_email: document.getElementById('guestEmail').value,
                check_in_date: document.getElementById('checkInDate').value,
                check_in_time: document.getElementById('checkInTime').value,
                check_out_date: document.getElementById('checkOutDate').value,
                check_out_time: document.getElementById('checkOutTime').value,
                total_price: parseFloat(document.getElementById('roomPrice').value),
                payment_method: document.getElementById('paymentMethod').value
            };

            try {
                const response = await fetch(`${API_BASE_URL}/bookings`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    responseMsg.style.color = 'green';
                    responseMsg.innerText = 'Booking successful!';
                    setTimeout(() => { closeBookingModal(); }, 1500);
                } else {
                    responseMsg.style.color = 'red';
                    responseMsg.innerText = data.error || 'Failed to submit booking.';
                }
            } catch (error) {
                console.error('Error submitting booking:', error);
                responseMsg.style.color = 'red';
                responseMsg.innerText = 'Cannot connect to backend server.';
            }
        }
    </script>
</body>
</html>
