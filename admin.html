<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Lunara Hotel</title>
    <!-- GUMAGAMIT NA DIN NG COMBINED STYLE.CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ADMIN HEADER -->
    <header>
        <h1>LUNARA HOTEL — Admin Panel</h1>
        <span>Logged in as: Administrator</span>
    </header>

    <div class="admin-container">
        
        <!-- DASHBOARD SUMMARY CARDS -->
        <div class="stats-grid">
            <div class="stat-card">
                <h4>Total Bookings</h4>
                <p class="number" id="totalBookingsCount">0</p>
            </div>
            <div class="stat-card" style="border-left-color: var(--accent);">
                <h4>Total Revenue</h4>
                <p class="number" id="totalRevenue">₱0</p>
            </div>
            <div class="stat-card" style="border-left-color: var(--success);">
                <h4>Active Guests</h4>
                <p class="number" id="activeGuestsCount">0</p>
            </div>
        </div>

        <!-- BOOKINGS TABLE -->
        <div class="table-container">
            <div class="table-header">
                <h3>Reservation Management</h3>
                <button class="btn-refresh" onclick="fetchBookings()">🔄 Refresh Data</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Guest Name</th>
                        <th>Email</th>
                        <th>Room ID</th>
                        <th>Check-In (Date & Time)</th>
                        <th>Check-Out (Date & Time)</th>
                        <th>Total Price</th>
                        <th>Payment</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="adminBookingTable">
                    <!-- Dito lalabas ang mga pumasok na bookings -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- JAVASCRIPT FOR ADMIN -->
    <script>
        const API_BASE_URL = 'http://localhost:3000/api/v1';

        document.addEventListener('DOMContentLoaded', fetchBookings);

        async function fetchBookings() {
            try {
                const response = await fetch(`${API_BASE_URL}/bookings`);
                const bookings = await response.json();

                const tableBody = document.getElementById('adminBookingTable');
                tableBody.innerHTML = '';

                let totalRevenueCount = 0;

                if (!bookings || bookings.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding: 20px;">Walang nakitang bookings sa database.</td></tr>`;
                    updateStats(0, 0);
                    return;
                }

                bookings.forEach(booking => {
                    const price = parseFloat(booking.total_price) || 0;
                    totalRevenueCount += price;

                    const checkInDisplay = `${booking.check_in_date || booking.check_in || 'N/A'} @ ${booking.check_in_time || '14:00'}`;
                    const checkOutDisplay = `${booking.check_out_date || booking.check_out || 'N/A'} @ ${booking.check_out_time || '12:00'}`;

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><strong>#${booking.id}</strong></td>
                        <td>${booking.guest_name}</td>
                        <td>${booking.guest_email || booking.email}</td>
                        <td><span class="badge badge-pending">Room ${booking.room_id || '1'}</span></td>
                        <td>${checkInDisplay}</td>
                        <td>${checkOutDisplay}</td>
                        <td><strong>₱${price.toLocaleString()}</strong></td>
                        <td>${booking.payment_method || 'PayAtHotel'}</td>
                        <td>
                            <button class="btn-action btn-delete" onclick="deleteBooking(${booking.id})">Delete</button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });

                updateStats(bookings.length, totalRevenueCount);

            } catch (error) {
                console.error('Error fetching bookings:', error);
                const tableBody = document.getElementById('adminBookingTable');
                tableBody.innerHTML = `<tr><td colspan="9" style="text-align:center; color:red; padding:20px;">Cannot connect to backend server (http://localhost:3000). Siguraduhing running ang Node.js!</td></tr>`;
            }
        }

        function updateStats(totalCount, totalRevenue) {
            document.getElementById('totalBookingsCount').innerText = totalCount;
            document.getElementById('totalRevenue').innerText = `₱${totalRevenue.toLocaleString()}`;
            document.getElementById('activeGuestsCount').innerText = totalCount;
        }

        async function deleteBooking(id) {
            if (!confirm(`Sigurado ka bang gusto mo i-delete ang Booking #${id}?`)) return;

            try {
                const response = await fetch(`${API_BASE_URL}/bookings/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    alert(`Booking #${id} successfully deleted.`);
                    fetchBookings();
                } else {
                    const result = await response.json();
                    alert('Failed to delete booking: ' + (result.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error deleting booking:', error);
                alert('Cannot connect to server to perform deletion.');
            }
        }
    </script>
</body>
</html>
